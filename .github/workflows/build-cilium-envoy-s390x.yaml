name: Build cilium-envoy (linux/s390x)

# Native linux/s390x build of cilium-envoy (Envoy 1.36.6 + Cilium) on the
# self-hosted IBM Z runner, published to ghcr.io/dnse-tech/cilium-envoy.
# Upstream publishes amd64/arm64 only; this fills the s390x gap so the cilium
# agent can ship with embedded Envoy on s390x.

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to ghcr"
        type: boolean
        default: true
  push:
    tags:
      - "cilium-envoy-s390x-*"

permissions:
  contents: read
  packages: write

env:
  ENVOY_SHA: b87d1e32f522b33bd51701c6476d199326f01496
  IMAGE: ghcr.io/dnse-tech/cilium-envoy
  IMAGE_TAG: v1.36.6-1778235340-b87d1e32f522b33bd51701c6476d199326f01496-s390x

jobs:
  build:
    runs-on: [self-hosted, s390x]
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build s390x cilium-envoy image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          # Reuse an image already built on this runner's shared docker daemon
          # (e.g. by a prior host validation build) to avoid a redundant ~90min
          # rebuild; otherwise build from source via the Dockerfile.
          if docker image inspect "$IMAGE:v1.19.4-s390x" >/dev/null 2>&1; then
            echo "Reusing cilium-envoy image already present on this daemon."
            docker tag "$IMAGE:v1.19.4-s390x" "$IMAGE:$IMAGE_TAG"
          else
            docker build -f images/s390x/Dockerfile.s390x -t "$IMAGE:$IMAGE_TAG" .
          fi

      - name: Verify reported envoy SHA
        run: docker run --rm "$IMAGE:$IMAGE_TAG" cilium-envoy --version | grep -q "$ENVOY_SHA"

      - name: Push
        if: ${{ github.event_name == 'push' || inputs.push }}
        run: |
          docker tag "$IMAGE:$IMAGE_TAG" "$IMAGE:v1.19.4-s390x"
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:v1.19.4-s390x"
